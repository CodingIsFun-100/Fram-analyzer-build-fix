name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  approve-and-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: release # Pauses the job here until manually approved in GitHub
    permissions:
      contents: write
    steps:
      - name: Download Artifact from Build Run
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.event.workflow_run.run_number }}
          name: Auto Release v1.0.${{ github.event.workflow_run.run_number }} (This automaticly releases after a build of the mod is completed.) NOT OFFICAL RELEASE.
          draft: false
          prerelease: false
          files: ./dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
